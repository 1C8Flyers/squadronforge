name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace @squadronforge/api run prisma:generate

      - name: Run API tests
        run: npm --workspace @squadronforge/api run test

      - name: Build monorepo
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Run Docker smoke test
        run: pwsh -File ./scripts/docker-smoke.ps1 -MaxWaitSeconds 120

      - name: Shutdown Docker stack
        if: always()
        run: docker compose down -v
