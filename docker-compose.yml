services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squadronforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d squadronforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./docker/secrets:/run/secrets:ro
    ports:
      - "${API_HOST_PORT:-4000}:4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./docker/secrets:/run/secrets:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-5173}:80"

volumes:
  pg_data:
